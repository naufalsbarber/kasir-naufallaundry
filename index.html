  // ============================================
  // XLSX BUILDER (format OOXML asli, tanpa dependency eksternal)
  // ============================================
  _crc32(buf) {
    let table = this.__crc32Table;
    if (!table) {
      table = this.__crc32Table = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        table[n] = c >>> 0;
      }
    }
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < buf.length; i++) crc = table[(crc ^ buf[i]) & 0xFF] ^ (crc >>> 8);
    return (crc ^ 0xFFFFFFFF) >>> 0;
  },

  _dosDateTime(date) {
    const dosTime = ((date.getHours() & 0x1F) << 11) | ((date.getMinutes() & 0x3F) << 5) | ((date.getSeconds() >> 1) & 0x1F);
    const dosDate = (((date.getFullYear() - 1980) & 0x7F) << 9) | (((date.getMonth() + 1) & 0xF) << 5) | (date.getDate() & 0x1F);
    return { dosTime, dosDate };
  },

  buildZip(files) {
    const encoder = new TextEncoder();
    const localParts = [];
    const centralParts = [];
    let offset = 0;
    const { dosTime, dosDate } = this._dosDateTime(new Date());

    files.forEach(f => {
      const nameBytes = encoder.encode(f.name);
      const content = typeof f.content === 'string' ? encoder.encode(f.content) : f.content;
      const crc = this._crc32(content);
      const size = content.length;

      const localHeader = new Uint8Array(30 + nameBytes.length);
      const lv = new DataView(localHeader.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0, true);
      lv.setUint16(8, 0, true);
      lv.setUint16(10, dosTime, true);
      lv.setUint16(12, dosDate, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, size, true);
      lv.setUint32(22, size, true);
      lv.setUint16(26, nameBytes.length, true);
      lv.setUint16(28, 0, true);
      localHeader.set(nameBytes, 30);
      localParts.push(localHeader, content);

      const centralHeader = new Uint8Array(46 + nameBytes.length);
      const cv = new DataView(centralHeader.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, dosTime, true);
      cv.setUint16(14, dosDate, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, size, true);
      cv.setUint32(24, size, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      centralHeader.set(nameBytes, 46);
      centralParts.push(centralHeader);
      offset += localHeader.length + content.length;
    });

    const centralStart = offset;
    let centralSize = 0;
    centralParts.forEach(c => centralSize += c.length);

    const eocd = new Uint8Array(22);
    const ev = new DataView(eocd.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(4, 0, true);
    ev.setUint16(6, 0, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, centralSize, true);
    ev.setUint32(16, centralStart, true);
    ev.setUint16(20, 0, true);

    const allParts = [...localParts, ...centralParts, eocd];
    const totalLen = allParts.reduce((a, p) => a + p.length, 0);
    const result = new Uint8Array(totalLen);
    let pos = 0;
    allParts.forEach(p => { result.set(p, pos); pos += p.length; });
    return result;
  },

  _xlsxColLetter(n) {
    let s = '';
    while (n > 0) {
      const rem = (n - 1) % 26;
      s = String.fromCharCode(65 + rem) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  },

  _escXmlAttr(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
  },

  // sheetsData: [{ name, rows: [[val, ...], ...] }], val string atau number
  buildXlsx(sheetsData) {
    const files = [];
    const escXml = this._escXmlAttr;

    files.push({ name: '[Content_Types].xml', content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
${sheetsData.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('\n')}
</Types>` });

    files.push({ name: '_rels/.rels', content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>` });

    files.push({ name: 'xl/_rels/workbook.xml.rels', content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${sheetsData.map((s, i) => `<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('\n')}
</Relationships>` });

    files.push({ name: 'xl/workbook.xml', content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>
${sheetsData.map((s, i) => `<sheet name="${escXml(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('\n')}
</sheets>
</workbook>` });

    sheetsData.forEach((s, i) => {
      let rowsXml = '';
      s.rows.forEach((row, rIdx) => {
        const rowNum = rIdx + 1;
        let cellsXml = '';
        row.forEach((val, cIdx) => {
          const cellRef = this._xlsxColLetter(cIdx + 1) + rowNum;
          if (typeof val === 'number') {
            cellsXml += `<c r="${cellRef}"><v>${val}</v></c>`;
          } else if (val != null && val !== '') {
            cellsXml += `<c r="${cellRef}" t="inlineStr"><is><t xml:space="preserve">${escXml(val)}</t></is></c>`;
          }
        });
        rowsXml += `<row r="${rowNum}">${cellsXml}</row>`;
      });
      files.push({ name: `xl/worksheets/sheet${i+1}.xml`, content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetData>${rowsXml}</sheetData>
</worksheet>` });
    });

    return this.buildZip(files);
  },

};/* ============================================================
   LAPORAN — digambar di canvas (gaya Barber): logo, nama usaha, jumlah pemasukan + rincian
   Palet Naufal Laundry: hitam + emas (dari logo mahkota "N")

const C = { ink: '#1a1a1a', gold: '#b8934a', gold2: '#d4af6a', dark: '#111111', dark2: '#2b2620', line: '#ddd6c8', muted: '#6b6455', paper: '#faf8f4', ok: '#2e7d4f', bad: '#c0392b', warn: '#b8562e', info: '#2e6f9e', goldDeep: '#8a6d1e' };

let _logoCv = null;
function loadImg(src) { return new Promise(r => { if (!src) return r(null); const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; }); }
async function loadLogo() { if (!_logoCv) _logoCv = await loadImg(typeof LOGO_FULL_B64 !== 'undefined' ? LOGO_FULL_B64 : ''); return _logoCv; }

/* painter: dua putaran (ukur tinggi → gambar) supaya laporan sepanjang apa pun muat */
async function paintReport(W, build) {
  try { await document.fonts.ready; } catch (e) { }
  const logo = await loadLogo();
  const mk = (cv) => {
    const x = cv ? cv.getContext('2d') : null, dry = !cv;
    const o = { x, dry, W, y: 0, logo, P: 56 };
    o.rect = (a, b, w, h, c) => { if (dry) return; x.fillStyle = c; x.fillRect(a, b, w, h); };
    o.rrect = (a, b, w, h, r, c, stroke) => {
      if (dry) return; x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath();
      if (c) { x.fillStyle = c; x.fill(); } if (stroke) { x.strokeStyle = stroke; x.lineWidth = 2; x.stroke(); }
    };
    o.txt = (t, X, Y, { a = 'left', c = C.ink, w = 500, sz = 28, f = 'Inter' } = {}) => { if (dry) return; x.font = FONT(w, sz, f); x.fillStyle = c; x.textAlign = a; x.fillText(String(t), X, Y); };
    o.cut = (t, maxW, { w = 500, sz = 28 } = {}) => { const s = SCRATCH(); s.font = FONT(w, sz); let r = String(t); while (r.length > 1 && s.measureText(r).width > maxW) r = r.slice(0, -1); return r === String(t) ? r : r.trimEnd() + '…'; };
    return o;
  };
  const d = mk(null); d.y = 0; const H = Math.ceil(build(d) + 10);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const o = mk(cv); o.x.fillStyle = '#fff'; o.x.fillRect(0, 0, W, H); build(o);
  return cv;
}
function repHeader(o, title, sub) {

function repSec(o, t) {

function repBars(o, title, data, dayN, c1, c2, h = 260, unit = '') {

/* ---------- data laporan ---------- */

  lapHarianData(tglStr) {
    const trxAll = loadJSON(STORAGE_KEYS.TRANSAKSI, []), pengAll = loadJSON(STORAGE_KEYS.PENGELUARAN, []);
    const masuk = trxAll.filter(t => fmtTglSingkat(t.tglMasuk) === tglStr);
    const keluar = trxAll.filter(t => t.tglDiambil && fmtTglSingkat(t.tglDiambil) === tglStr);
    const pengeluaran = pengAll.filter(p => fmtTglSingkat(p.tanggal) === tglStr);
    const bayarHariIni = trxAll.filter(t => t.tglLunas && fmtTglSingkat(t.tglLunas) === tglStr);
    // "Jumlah Pemasukan"/"Jumlah Diambil" hanya menghitung transaksi yang LUNASNYA juga di hari itu (aturan lama dipertahankan)

    const totalKeluar = keluar.filter(lunasHariIni).reduce((a, b) => a + b.total, 0);

  /* ---------- laporan bulanan ---------- */
  lapBulanData(ym) {
    const [y, m] = ym.split('-').map(Number), n = new Date(y, m, 0).getDate();
    const inMonth = ts => { const d = new Date(ts); return d.getFullYear() === y && d.getMonth() + 1 === m; };
    const trxAll = loadJSON(STORAGE_KEYS.TRANSAKSI, []), pengAll = loadJSON(STORAGE_KEYS.PENGELUARAN, []);
    const masuk = trxAll.filter(t => inMonth(t.tglMasuk)), keluar = trxAll.filter(t => t.tglDiambil && inMonth(t.tglDiambil));
    const lunas = trxAll.filter(t => t.statusBayar === 'Lunas' && t.tglLunas && inMonth(t.tglLunas));
    const peng = pengAll.filter(p => inMonth(p.tanggal));
    const dayOf = ts => new Date(ts).getDate() - 1;
    const ordMasuk = new Array(n).fill(0), kgMasuk = new Array(n).fill(0), ordKeluar = new Array(n).fill(0), terima = new Array(n).fill(0), keluarRp = new Array(n).fill(0);
    masuk.forEach(t => { ordMasuk[dayOf(t.tglMasuk)]++; kgMasuk[dayOf(t.tglMasuk)] += kgOf(t); });
    keluar.forEach(t => { ordKeluar[dayOf(t.tglDiambil)]++; });
    lunas.forEach(t => { terima[dayOf(t.tglLunas)] += t.total; });
    peng.forEach(p => { keluarRp[dayOf(p.tanggal)] += p.jumlah; });
    const by = k => sum(lunas.filter(t => t.metodeBayar === k), t => t.total);
    const perJenis = {}; masuk.forEach(t => t.items.forEach(it => { perJenis[it.jenisCuci] = (perJenis[it.jenisCuci] || 0) + itemSub(it); }));
    const perKasir = {}; masuk.forEach(t => { const k = t.kasir || '-'; (perKasir[k] ||= { n: 0, omzet: 0 }); perKasir[k].n++; perKasir[k].omzet += t.total; });
    const kat = {}; peng.forEach(p => { kat[p.jenis] = (kat[p.jenis] || 0) + p.jumlah; });
    const omzet = sum(masuk, t => t.total), diterima = sum(lunas, t => t.total);
    const belumBayar = sum(masuk.filter(t => t.statusBayar !== 'Lunas'), t => t.total);
    return { ym, y, m, n, masuk, keluar, lunas, peng, ordMasuk, kgMasuk, ordKeluar, terima, keluarRp, tunai: by('Tunai'), qris: by('QRIS'), transfer: by('Transfer'), lainnya: diterima - by('Tunai') - by('QRIS') - by('Transfer'), perJenis, perKasir, kat, omzet, diterima, belumBayar, pengeluaran: sum(peng, p => p.jumlah), kgM: sum(masuk, kgOf), kgK: sum(keluar, kgOf) };

    <div class="row" style="margin-top:10px"><input type="text" placeholder="${esc(ph)}"><button class="btn btn-outline" style="flex:0 0 auto">Tambah</button></div>`;
  const save = fn => { const st = JSON.parse(JSON.stringify(ST())); st[key] = st[key] || []; fn(st[key]); DB.put('settings', st); chipEditor(el, key, label, ph); toast('Disimpan'); };
  $$('[data-x]', el).forEach(b => b.onclick = () => save(a => a.splice(+b.dataset.x, 1)));
  const add = () => { const v = $('input', el).value.trim(); if (!v) return; save(a => { if (!a.includes(v)) a.push(v); }); };
  $('button', el).onclick = add; $('input', el).onkeydown = e => { if (e.key === 'Enter') add(); };
}

/* ---------- DATA ---------- */
function oData(el) {
  const cnt = c => DB.list(c).filter(d => !d._del).length;
  el.innerHTML = `<div class="card"><h2>Backup data</h2><p style="font-size:12px;color:#777;margin-top:0">Simpan semua data (transaksi, pelanggan, pengeluaran, pengaturan) ke satu file .json. Simpan di Google Drive atau kirim ke WA sendiri.</p><button class="btn btn-gold btn-block" id="exp">Export backup</button></div>
    <div class="card"><h2>Import dari backup</h2><p style="font-size:12px;color:#777;margin-top:0">Bisa membaca backup lama dari aplikasi Naufal Laundry (APK/web lama) maupun backup dari web baru ini. Data yang sudah ada tidak akan dobel.</p>
      <label class="btn btn-outline btn-block" for="impF" style="cursor:pointer;margin:0">Pilih file backup (.json)</label><input id="impF" type="file" accept=".json,application/json" hidden></div>
    <div class="card" style="border-color:#efc3bd"><h2 style="color:var(--danger)">Reset data</h2><p style="font-size:12px;color:#777;margin-top:0">Untuk mulai dari nol setelah uji coba. Tidak bisa dibatalkan, jadi export backup dulu.</p>
      <div class="grid3" style="margin:8px 0"><div style="text-align:center"><div style="font-size:10px;color:#888">TRANSAKSI</div><b>${cnt('trx')}</b></div><div style="text-align:center"><div style="font-size:10px;color:#888">PENGELUARAN</div><b>${cnt('exp')}</b></div><div style="text-align:center"><div style="font-size:10px;color:#888">PELANGGAN</div><b>${cnt('cust')}</b></div></div>
      <button class="btn btn-danger btn-block" id="rst1">Reset transaksi saja</button><p style="font-size:11.5px;color:#888;margin:4px 0 10px">Menghapus transaksi, pengeluaran, pelanggan, dan nomor nota kembali ke NL0001. Pengaturan dan PIN tetap.</p>
      <button class="btn btn-danger btn-block" id="rst2">Reset total</button><p style="font-size:11.5px;color:#888;margin:4px 0 0">Menghapus semuanya termasuk pengaturan (PIN kembali 123456). Koneksi online tetap tersimpan.</p></div>`;
  $('#exp', el).onclick = exportBackup;
  $('#impF', el).onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importBackup(f); };
  $('#rst1', el).onclick = () => resetData('transaksi'); $('#rst2', el).onclick = () => resetData('total');
}
async function exportBackup() {
  toast('Menyiapkan backup…');
  let docs; try { docs = await DB.fetchAll(); } catch (e) { return toast('Gagal mengambil data online: ' + e.message, 5000); }
  const map = Object.fromEntries(docs.map(d => [d.id, d])); Object.values(DB.pending).forEach(d => map[d.id] = d);
  const out = { app: APP_ID, versi: 1, dibuat: realISO(), jumlah: Object.keys(map).length, docs: Object.values(map) };
  const now = new Date();
  await shareBlob(new Blob([JSON.stringify(out)], { type: 'application/json' }), `Backup-Kasir-NaufalLaundry-${dstr(now)}_${pad(now.getHours())}${pad(now.getMinutes())}.json`, 'Backup Kasir Naufal Laundry');
}
const OLD_TS = '2001-01-01T00:00:00.000Z';
function oldToDocs(data) {   // format lama: {app:'naufal-laundry-kasir', transaksi, pelanggan, pengeluaran, kasirList, notaCounter, notaPeriod}
  const docs = [], iso = ms => ms > 0 ? new Date(ms).toISOString() : OLD_TS;
  (data.transaksi || []).forEach(t => {
    if (!t || !t.id || !t.tglMasuk || !t.nota || !Array.isArray(t.items) || !t.pelanggan) return;
    const last = Math.max(t.tglMasuk || 0, t.tglLunas || 0, t.tglDiambil || 0);   // perubahan di app lama = waktu aktivitas terakhirnya
    docs.push({ id: t.id, col: 'trx', tgl: dstr(new Date(t.tglMasuk)), data: { ...t }, updated_at: iso(last) });
  });
  (data.pelanggan || []).forEach(p => { if (p && p.id && p.nama) docs.push({ id: p.id, col: 'cust', tgl: null, data: { ...p }, updated_at: iso(p.createdAt || 0) }); });
  (data.pengeluaran || []).forEach(e => { if (e && e.id && e.tanggal) docs.push({ id: e.id, col: 'exp', tgl: dstr(new Date(e.tanggal)), data: { ...e }, updated_at: iso(e.tanggal) }); });
  return docs;
}
async function importBackup(file) {
  let data; try { data = JSON.parse(await file.text()); } catch (e) { return toast('File tidak bisa dibaca. Pastikan ini file backup .json', 4000); }
  let docs, ket, old = false;
  if (data && data.app === APP_ID && Array.isArray(data.docs)) { docs = data.docs; ket = `File berisi ${docs.length} data, dibuat ${String(data.dibuat).slice(0, 10)}.`; }
  else if (data && Array.isArray(data.transaksi) && Array.isArray(data.pelanggan)) {
    old = true; docs = oldToDocs(data); ket = `Backup lama Naufal Laundry: ${data.transaksi.length} transaksi, ${data.pelanggan.length} pelanggan, ${(data.pengeluaran || []).length} pengeluaran.`;
  } else return toast('Ini bukan file backup Naufal Laundry', 4000);
  if (!await ask({ title: 'Import backup?', body: ket + '\nData yang sama tidak akan dobel.', ok: 'Import' })) return;
  let baru = 0, upd = 0, skip = 0;
  for (const d of docs) {
    if (!d || !d.id || !d.col || !d.data || d.id === 'reset' || (d.col === 'settings' && DB.docs.settings && data.app !== APP_ID)) { skip++; continue; }
    const cur = DB.docs[d.id];
    if (cur && new Date(cur.updated_at) >= new Date(d.updated_at)) { skip++; continue; }
    cur ? upd++ : baru++; DB.docs[d.id] = d; DB.pending[d.id] = d;
  }
  if (old) {
    if (Array.isArray(data.kasirList) && data.kasirList.length) {   // gabungkan daftar kasir
      const st = JSON.parse(JSON.stringify(ST())); const set = new Set([...(st.kasir || []), ...data.kasirList]);
      if (set.size !== (st.kasir || []).length) { st.kasir = [...set]; DB.put('settings', st); }
    }
    const n = parseInt(data.notaCounter, 10), per = data.notaPeriod;   // lantai nomor nota (nota yang pernah dihapus tidak dipakai ulang)
    const fl = DB.get('notaFloor');
    if (n > 0 && /^\d{4}-\d{2}$/.test(per || '') && (!fl || fl.period < per || (fl.period === per && fl.n < n))) DB.put('meta', { id: 'notaFloor', period: per, n });
  }
  DB.saveCache(); DB.flush(); app.renderTabs(); app.renderTab();
  ask({ title: 'Import selesai', body: `${baru} data baru ditambahkan, ${upd} diperbarui, ${skip} dilewati karena sudah ada atau lebih baru.\n\nData lama akan terkirim ke online di latar belakang (lihat status di kanan atas).`, ok: 'OK', noCancel: true });
}
async function resetData(scope) {
  const total = scope === 'total';
  const s1 = await ask({ title: total ? 'Reset total?' : 'Reset transaksi?', body: 'Sebaiknya export backup dulu. Tekan "Export dulu" untuk menyimpan backup, lalu ulangi reset.', ok: 'Lanjut tanpa backup', cancel: 'Export dulu', danger: true });
  if (!s1) return exportBackup();
  const typed = await ask({ title: 'Ketik HAPUS untuk konfirmasi', body: total ? 'Semua data dan pengaturan dihapus dari semua perangkat yang tersambung.' : 'Transaksi, pengeluaran, dan pelanggan dihapus dari semua perangkat yang tersambung.', input: { label: 'Konfirmasi', ph: 'HAPUS', required: 'Ketik HAPUS' }, ok: 'Hapus permanen', danger: true });
  if (typed == null) return;
  if (typed.trim().toUpperCase() !== 'HAPUS') return toast('Konfirmasi salah, tidak ada yang dihapus');
  try { await DB.remove(total ? 'id=not.is.null' : 'or=(col.in.(' + TX_COLS.join(',') + '),id.eq.notaFloor)'); }
  catch (e) { return toast('Gagal menghapus data online: ' + e.message, 6000); }
  const at = realISO(); wipeLocal(total ? null : TX_COLS, at);
  DB.put('meta', { id: 'reset', at, scope }); lsSet('resetSeen', at);
  if (total) { DB.put('settings', JSON.parse(JSON.stringify(DEF_SETTINGS))); state.currentKasir = null; storageRemoveRaw('nl_current_kasir'); state.owner = false; ssSet('owner', '0'); }
  state.activeTab = 'kasir'; app.renderTabs(); app.updateKasirBadge(); app.renderTab();
  toast(total ? 'Reset total selesai' : 'Data transaksi direset. Mulai dari nol!', 3500);
}

/* ---------- KONEKSI ---------- */
function oKoneksi(el) {
  const n = Object.keys(DB.pending).length;
  el.innerHTML = `<div class="card"><h2>Koneksi online (Supabase)</h2>
    <label>Project URL</label><input type="text" id="cu" value="${esc(DB.cfg.url)}">
    <label>Publishable / anon key</label><input type="text" id="ck" value="${esc(DB.cfg.key)}">
    <p style="font-size:12.5px;color:#555">Status: <b>${DB.status === 'on' ? 'Terhubung' : DB.status === 'local' ? 'Mode lokal (data hanya di perangkat ini)' : DB.status === 'sync' ? 'Menyimpan…' : 'Belum tersambung'}</b>
      ${DB.lastSync ? '<br>Sinkron terakhir: ' + pad(DB.lastSync.getHours()) + ':' + pad(DB.lastSync.getMinutes()) : ''}${DB.lastErr ? '<br>Error terakhir: ' + esc(DB.lastErr) : ''}${n ? `<br>${n} data menunggu dikirim.` : ''}</p>
    <button class="btn btn-gold btn-block" id="sc">Simpan &amp; sambungkan</button>
    <button class="btn btn-outline btn-block" id="sn" style="margin-top:8px">Sinkronkan sekarang</button>
    <p style="font-size:11.5px;color:#888;margin-bottom:0">Perangkat lain cukup membuka link web yang sama; koneksi sudah tertanam. Jangan pernah memasukkan password database atau service_role key ke sini.</p></div>`;
  $('#sc', el).onclick = async () => {
    DB.cfg = { url: $('#cu', el).value.trim(), key: $('#ck', el).value.trim() }; lsSet('cfg', DB.cfg);
    if (!DB.online()) { DB.status = 'local'; setStatus(); return vOwner(); }
    for (const [id, d] of Object.entries(DB.docs)) DB.pending[id] = d;
    toast('Menyambungkan…'); await DB.pull(); await DB.flush(); vOwner();
    toast(DB.status === 'on' ? 'Tersambung ✓' : 'Gagal tersambung. Cek URL & key.', 4000);
  };
  $('#sn', el).onclick = async () => { toast('Sinkronisasi…'); await DB.pull(); await DB.flush(); vOwner(); };
}

/* ---------- RIWAYAT UBAH ---------- */
function oLog(el) {
  const items = [];
  const push = (k, d, lbl) => (d.log || []).forEach(l => items.push({ k, lbl, ...l }));
  DB.list('trx').forEach(d => push('Transaksi', d, `${d.nota} · ${d.pelanggan.nama} · ${fmtRupiah(d.total)}`));
  DB.list('exp').forEach(d => push('Pengeluaran', d, `${d.jenis} · ${fmtRupiah(d.jumlah)}`));
  DB.list('cust').forEach(d => { if (d._del) items.push({ k: 'Pelanggan', lbl: d.nama, at: d._del.at, oleh: d._del.oleh, aksi: 'Hapus', ket: d._del.alasan }); });
  items.sort((a, b) => String(b.at).localeCompare(String(a.at)));
  el.innerHTML = `<div class="card"><h2>Riwayat perubahan</h2><p style="font-size:12px;color:#777;margin-top:0">Siapa yang mengubah, melunasi, atau menghapus transaksi/pengeluaran, kapan, dan alasannya (${CACHE_DAYS} hari terakhir).</p>
    ${items.length ? items.slice(0, 120).map(i => `<div class="transaksi-row"><div class="transaksi-nota">${esc(i.aksi)} · ${esc(i.k.toLowerCase())}: ${esc(i.lbl)}</div><div class="transaksi-meta">${esc(i.oleh)} · ${fmtTglSingkat(new Date(i.at).getTime())} ${pad(new Date(i.at).getHours())}:${pad(new Date(i.at).getMinutes())}${i.ket ? ' · ' + esc(i.ket) : ''}</div></div>`).join('') : '<div class="empty-state">Belum ada perubahan.</div>'}</div>`;
}

/* ============================================================
   BOOT
   ============================================================ */
function softRefresh() {
  if ($('.modal-overlay') || $('.dlg-ovl') || document.activeElement?.matches('input,textarea,select')) return;
  if (['status', 'riwayat', 'pelanggan'].includes(state.activeTab)) app.renderTab();
}
(async function boot() {
  DB.init();
  if (!DB.online() || DB.get('settings')) seedIfEmpty();   // perangkat baru yang online: tunggu data online dulu
  await app.init(); setStatus();
  document.getElementById('gearBtn').onclick = () => app.switchTab('owner');
  if (DB.online()) { await DB.pull(); if (DB.status !== 'off') seedIfEmpty(); if (!$('.modal-overlay') && !$('.dlg-ovl')) app.renderTab(); }
  if (!state.currentKasir && !$('.modal-overlay')) app.openKasirPicker();
  setInterval(async () => { if (document.hidden || !DB.online()) return; await DB.pull(); softRefresh(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && DB.online()) DB.pull().then(softRefresh); });
  window.addEventListener('online', () => DB.flush());
})();

</script>
